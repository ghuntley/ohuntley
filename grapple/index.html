<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Skyhook — Grapple</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #06040c;
      font-family: system-ui, sans-serif;
      color: #c8f4ff;
    }
    #game-canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    a.home {
      position: fixed;
      top: 0.75rem;
      left: 0.75rem;
      z-index: 20;
      color: #7df9ff;
      text-decoration: none;
      font-size: 0.9rem;
      text-shadow: 0 0 8px rgba(0, 255, 238, 0.5);
    }
    a.home:hover {
      color: #fff;
    }
    #blocker {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse 70% 50% at 50% 40%, rgba(0, 200, 255, 0.12), transparent 55%),
        rgba(6, 4, 12, 0.92);
      cursor: pointer;
      text-align: center;
      padding: 1rem;
    }
    #blocker h1 {
      margin: 0 0 0.5rem;
      font-size: clamp(1.1rem, 4vw, 1.75rem);
      letter-spacing: 0.08em;
      color: #00fff2;
      text-shadow: 0 0 20px rgba(0, 255, 238, 0.6);
    }
    #blocker p {
      margin: 0.25rem 0;
      max-width: 28rem;
      line-height: 1.5;
      font-size: 0.95rem;
      opacity: 0.9;
    }
    #blocker kbd {
      padding: 0.1em 0.35em;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(0, 255, 238, 0.35);
    }
    #hud {
      position: fixed;
      bottom: 0.75rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 5;
      font-size: 0.8rem;
      opacity: 0.85;
      pointer-events: none;
      text-align: center;
      text-shadow: 0 0 6px rgba(0, 0, 0, 0.9);
    }
    #crosshair {
      position: fixed;
      left: 50%;
      top: 50%;
      width: 10px;
      height: 10px;
      margin: -5px 0 0 -5px;
      border: 1px solid rgba(0, 255, 238, 0.7);
      border-radius: 50%;
      z-index: 5;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s;
    }
    body.locked #crosshair {
      opacity: 1;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "../vendor/three/build/three.module.js",
      "three/addons/": "../vendor/three/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <a class="home" href="../index.html">← Arcade</a>
  <div id="blocker">
    <h1>SKYHOOK</h1>
    <p>Click to play · <kbd>W A S D</kbd> move · <kbd>Space</kbd> jump · mouse look</p>
    <p><kbd>LMB</kbd> fire / release grapple · <kbd>R</kbd> release rope · <kbd>Esc</kbd> pause</p>
    <p>Hook the cyan neon surfaces — reach the gold platform.</p>
  </div>
  <div id="crosshair" aria-hidden="true"></div>
  <p id="hud" role="status"></p>
  <canvas id="game-canvas"></canvas>
  <script type="module" src="./grapple-game.js"></script>
  <script src="/sw-register.js"></script>
</body>
</html>
