<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Meerkat Run — Desert Chase</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>Meerkat Run</h1>
  <div id="wrap">
    <canvas id="game" width="320" height="180" tabindex="0" role="application" aria-label="Meerkat Run game"></canvas>
  </div>
  <p id="hud">
    Click the game to focus · <kbd>Space</kbd>/<kbd>Enter</kbd>/<kbd>R</kbd> to start · Auto-run ·
    Three stages per run (harder each time) ·
    <kbd>Space</kbd>/<kbd>W</kbd>/<kbd>↑</kbd> or <strong>tap</strong> to jump ·
    <kbd>P</kbd>/<kbd>Esc</kbd> pause · <kbd>F</kbd> fullscreen · <kbd>R</kbd> restart
  </p>
  <script type="module" src="game.js"></script>
</body>
</html>
