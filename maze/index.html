<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maze Runner</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <a class="back" href="../index.html" title="Back to the arcade">Home</a>
    <div class="game-container">
        <h1>Maze Runner</h1>
        <div class="game-info">
            <div class="stats">
                <p>Time: <span id="timer">0</span> seconds</p>
                <p>Current Score: <span id="currentScore">0</span></p>
            </div>
            <div class="high-scores">
                <h2>High Scores</h2>
                <ol id="highScoresList"></ol>
            </div>
        </div>
        <canvas id="gameCanvas" tabindex="0" role="img" aria-label="Maze playfield — use arrow keys"></canvas>
        <p class="maze-shortcuts">
            <kbd>R</kbd> restart · <kbd>P</kbd> or <kbd>Esc</kbd> pause · <kbd>Space</kbd> also pauses
        </p>
        <div class="controls">
            <button id="restartButton" type="button">Restart</button>
        </div>
    </div>
    <script src="../arcade-tokens.js"></script>
    <script src="../arcade-scores.js"></script>
    <script src="game.js"></script>
</body>
</html>
