<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vector Strike — FPS</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #06030c;
      font-family: system-ui, sans-serif;
      color: #ffe9f4;
    }
    #game-canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    a.home {
      position: fixed;
      top: 0.75rem;
      left: 0.75rem;
      z-index: 30;
      color: #ff6eb4;
      text-decoration: none;
      font-size: 0.9rem;
      letter-spacing: 0.08em;
      text-shadow: 0 0 10px rgba(255, 20, 147, 0.55);
    }
    a.home:hover { color: #fff; }

    #blocker {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(ellipse 80% 60% at 50% 38%, rgba(255, 20, 147, 0.12), transparent 55%),
        radial-gradient(ellipse 60% 50% at 50% 70%, rgba(0, 255, 238, 0.06), transparent 50%),
        rgba(8, 4, 16, 0.94);
      cursor: pointer;
      text-align: center;
      padding: 1rem;
    }
    #blocker h1 {
      margin: 0 0 0.6rem;
      font-size: clamp(1.4rem, 5vw, 2.1rem);
      letter-spacing: 0.18em;
      color: #ff5cd2;
      text-shadow:
        0 0 12px rgba(255, 92, 210, 0.7),
        0 0 30px rgba(255, 20, 147, 0.45);
    }
    #blocker p {
      margin: 0.25rem 0;
      max-width: 30rem;
      line-height: 1.5;
      font-size: 0.95rem;
      opacity: 0.92;
    }
    #blocker kbd {
      padding: 0.1em 0.4em;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 92, 210, 0.45);
    }
    #blocker .accent { color: #00fff2; }
    #blocker .danger { color: #ff5252; }

    /* HUD */
    #hud-top-left {
      position: fixed;
      top: 0.75rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 5;
      pointer-events: none;
      text-align: center;
      font-size: 0.85rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #ff6eb4;
      text-shadow: 0 0 8px rgba(255, 20, 147, 0.55);
      opacity: 0;
      transition: opacity 0.15s;
    }
    body.locked #hud-top-left { opacity: 1; }

    #health-bar-wrap {
      position: fixed;
      bottom: 1rem;
      left: 1rem;
      z-index: 5;
      width: clamp(14rem, 26vw, 22rem);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s;
    }
    body.locked #health-bar-wrap { opacity: 1; }
    #health-label {
      font-size: 0.8rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #ff8aaa;
      text-shadow: 0 0 6px rgba(255, 20, 100, 0.55);
      margin-bottom: 0.2rem;
    }
    #health-bar {
      height: 0.65rem;
      border-radius: 999px;
      background: rgba(40, 8, 24, 0.75);
      box-shadow:
        inset 0 0 6px rgba(0, 0, 0, 0.6),
        0 0 8px rgba(255, 20, 147, 0.25);
      overflow: hidden;
    }
    #health-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #ff5252, #ff5cd2 55%, #ffe27a);
      box-shadow: 0 0 10px rgba(255, 92, 210, 0.85);
      transition: width 0.18s ease;
    }

    #ammo-readout {
      position: fixed;
      bottom: 1rem;
      right: 1rem;
      z-index: 5;
      pointer-events: none;
      text-align: right;
      opacity: 0;
      transition: opacity 0.15s;
    }
    body.locked #ammo-readout { opacity: 1; }
    #ammo-label {
      font-size: 0.7rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #80f5ff;
      text-shadow: 0 0 6px rgba(0, 255, 238, 0.55);
    }
    #ammo-count {
      font-size: 1.65rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: #ffe27a;
      text-shadow: 0 0 12px rgba(255, 226, 122, 0.7);
    }
    #ammo-count.reloading { color: #ff8a80; }
    #ammo-count .ammo-max {
      font-size: 1rem;
      opacity: 0.7;
      color: #80f5ff;
    }

    #score-readout {
      position: fixed;
      top: 0.85rem;
      right: 1rem;
      z-index: 5;
      pointer-events: none;
      text-align: right;
      font-size: 0.85rem;
      letter-spacing: 0.16em;
      color: #80f5ff;
      text-shadow: 0 0 8px rgba(0, 255, 238, 0.5);
      opacity: 0;
      transition: opacity 0.15s;
    }
    body.locked #score-readout { opacity: 1; }
    #score-readout strong {
      color: #fff;
      font-size: 1rem;
      letter-spacing: 0.04em;
    }

    /* Crosshair */
    #crosshair {
      position: fixed;
      left: 50%;
      top: 50%;
      width: 22px;
      height: 22px;
      margin: -11px 0 0 -11px;
      z-index: 6;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s;
    }
    body.locked #crosshair { opacity: 0.92; }
    #crosshair::before,
    #crosshair::after {
      content: "";
      position: absolute;
      background: #ff5cd2;
      box-shadow: 0 0 5px rgba(255, 20, 147, 0.85);
    }
    #crosshair::before {
      left: 50%;
      top: 0;
      width: 2px;
      height: 100%;
      margin-left: -1px;
    }
    #crosshair::after {
      top: 50%;
      left: 0;
      width: 100%;
      height: 2px;
      margin-top: -1px;
    }
    #crosshair.hit::before,
    #crosshair.hit::after {
      background: #ffe27a;
      box-shadow: 0 0 8px rgba(255, 234, 0, 0.95);
    }

    /* Damage vignette flash */
    #dmg-flash {
      position: fixed;
      inset: 0;
      z-index: 8;
      pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 30%, rgba(255, 0, 60, 0.45) 100%);
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    /* Center status banner (wave start, victory) */
    #center-status {
      position: fixed;
      left: 50%;
      top: 32%;
      transform: translate(-50%, -50%);
      z-index: 7;
      pointer-events: none;
      text-align: center;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #00fff2;
      text-shadow: 0 0 12px rgba(0, 255, 238, 0.8);
      font-size: clamp(1rem, 3vw, 1.4rem);
      opacity: 0;
      transition: opacity 0.25s;
    }
    #center-status.show { opacity: 1; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "../vendor/three/build/three.module.js",
      "three/addons/": "../vendor/three/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <a class="home" href="../index.html">← Arcade</a>

  <div id="blocker">
    <h1>VECTOR STRIKE</h1>
    <p>Click to enter the arena · <kbd>W A S D</kbd> move · <kbd>Space</kbd> jump · mouse look</p>
    <p><span class="accent">LMB</span> fire · <kbd>R</kbd> reload · <kbd>Esc</kbd> release mouse</p>
    <p>Survive <strong>5</strong> waves of neon attackers — keep moving and headshot the drones for bonus points.</p>
  </div>

  <div id="hud-top-left">VECTOR STRIKE</div>
  <div id="health-bar-wrap" aria-hidden="true">
    <div id="health-label">HP <span id="health-text">100</span></div>
    <div id="health-bar"><div id="health-fill"></div></div>
  </div>
  <div id="score-readout">
    Wave <strong id="wave-text">1</strong> · Foes <strong id="enemies-text">0</strong> · Score <strong id="score-text">0</strong>
  </div>
  <div id="ammo-readout">
    <div id="ammo-label">Ammo</div>
    <div id="ammo-count"><span id="ammo-loaded">12</span><span class="ammo-max"> / 12</span></div>
  </div>
  <div id="crosshair" aria-hidden="true"></div>
  <div id="dmg-flash" aria-hidden="true"></div>
  <p id="center-status" role="status"></p>

  <canvas id="game-canvas"></canvas>

  <script src="../arcade-tokens.js"></script>
  <script src="../arcade-scores.js"></script>
  <script src="../arcade-gamepad.js"></script>
  <script type="module" src="./game.js"></script>
  <script src="/sw-register.js"></script>
</body>
</html>
